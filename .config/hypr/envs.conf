# User overrides for session environment.
# Keep SHELL aligned with the default login shell so xdg-terminal-exec launches zsh.

env = SHELL,/usr/bin/zsh

# Cursor theme
# Bibata Modern Classic stays visible on light and dark backgrounds.
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,32
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,32
